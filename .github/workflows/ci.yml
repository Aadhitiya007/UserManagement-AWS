name: MERN Project CI

on:
  push:
    branches: [master,  feature/product-routes, feature/aws-integration]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  frontend-ci:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: UserManagement/my-react-app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Build React application
        run: npm run build

  backend-ci:
    name: Backend Syntax & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: UserManagement/my-react-app/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: node --check server.js
